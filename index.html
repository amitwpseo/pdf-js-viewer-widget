<style>
  .sc-pdf-section {
    width: 100%;
    font-family: 'Inter', sans-serif;
    box-sizing: border-box;
    padding: 40px 0;
  }

  /* --- Viewer Shell --- */
  .sc-pdf-shell {
    position: relative;
    max-width: 960px;
    margin: 0 auto;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(10, 8, 22, 0.85);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    box-shadow: 0 40px 100px rgba(0,0,0,0.75), inset 0 1px 0 rgba(255,255,255,0.06);
    overflow: hidden;
  }

  /* --- Top Bar --- */
  .sc-pdf-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    background: rgba(0,0,0,0.4);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    gap: 12px;
    flex-wrap: wrap;
  }
  .sc-pdf-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Archivo Black', sans-serif;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #fff;
    opacity: 0.7;
    white-space: nowrap;
  }
  .sc-pdf-page-info {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: #A9A9BC;
    white-space: nowrap;
  }
  .sc-pdf-page-info span {
    color: #FF9100;
    font-weight: 700;
  }
  .sc-pdf-download {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 8px 20px;
    background: linear-gradient(90deg, #FF9100, #F12711);
    color: #fff !important;
    text-decoration: none !important;
    font-family: 'Archivo Black', sans-serif;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    border-radius: 100px;
    border: 1px solid rgba(255,255,255,0.2);
    box-shadow: 0 6px 20px rgba(241,39,17,0.35);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    white-space: nowrap;
  }
  .sc-pdf-download:hover {
    transform: scale(1.04) translateY(-1px);
    box-shadow: 0 10px 30px rgba(241,39,17,0.55);
    color: #fff !important;
    text-decoration: none !important;
  }

  /* --- Canvas Stage --- */
  .sc-pdf-stage {
    position: relative;
    width: 100%;
    min-height: 520px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #0a0816;
  }

  .sc-pdf-canvas-wrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    padding: 24px;
    box-sizing: border-box;
  }

  @media (max-width: 600px) {
    .sc-pdf-stage {
      min-height: unset;
      height: auto;
    }
    .sc-pdf-canvas-wrap {
      padding: 12px;
    }
  }

  #scPdfCanvas {
    display: block;
    max-width: 100%;
    height: auto;
    border-radius: 8px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.7);
    transition: opacity 0.3s ease;
  }

  /* --- Loading Overlay --- */
  .sc-pdf-loader {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: #0a0816;
    z-index: 10;
    transition: opacity 0.4s ease;
  }
  .sc-pdf-loader.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .sc-spinner {
    width: 44px; height: 44px;
    border: 3px solid rgba(255,255,255,0.08);
    border-top-color: #FF9100;
    border-radius: 50%;
    animation: scSpin 0.8s linear infinite;
  }
  @keyframes scSpin { to { transform: rotate(360deg); } }
  .sc-loader-text {
    font-family: 'Archivo Black', sans-serif;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #A9A9BC;
  }

  /* --- Error State --- */
  .sc-pdf-error {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 60px 30px;
    text-align: center;
  }
  .sc-pdf-error.visible { display: flex; }
  .sc-pdf-error-icon { font-size: 3rem; color: #A9A9BC; }
  .sc-pdf-error h4 {
    font-family: 'Archivo Black', sans-serif;
    font-size: 1.1rem;
    text-transform: uppercase;
    color: #fff;
    margin: 0;
  }
  .sc-pdf-error p { color: #A9A9BC; font-size: 14px; margin: 0; }

  /* --- Arrow Nav --- */
  .sc-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 48px; height: 48px;
    border-radius: 50%;
    background: rgba(15, 11, 30, 0.85);
    border: 1px solid rgba(255,255,255,0.15);
    color: #fff;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    z-index: 20;
    transition: background 0.3s, border-color 0.3s, transform 0.2s;
    outline: none;
  }
  .sc-arrow:hover {
    background: rgba(47,101,185,0.5);
    border-color: #2F65B9;
    transform: translateY(-50%) scale(1.1);
  }
  .sc-arrow:disabled { opacity: 0.2; pointer-events: none; }
  .sc-arrow-left  { left: 16px; }
  .sc-arrow-right { right: 16px; }

  /* --- Bottom Bar --- */
  .sc-pdf-bottom {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 16px 24px;
    background: rgba(0,0,0,0.35);
    border-top: 1px solid rgba(255,255,255,0.05);
    flex-wrap: wrap;
  }
  .sc-thumb-strip {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    max-width: 100%;
    padding: 4px 0;
    scrollbar-width: none;
  }
  .sc-thumb-strip::-webkit-scrollbar { display: none; }
  .sc-thumb {
    flex-shrink: 0;
    width: 44px; height: 58px;
    border-radius: 5px;
    border: 2px solid transparent;
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.25s, transform 0.25s;
    background: rgba(255,255,255,0.05);
  }
  .sc-thumb:hover { transform: scale(1.08); border-color: rgba(255,255,255,0.3); }
  .sc-thumb.active { border-color: #FF9100; box-shadow: 0 0 12px rgba(255,145,0,0.4); }
  .sc-thumb canvas { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* --- Zoom Controls --- */
  .sc-zoom-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
  }
  .sc-zoom-btn {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    color: #fff;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    transition: background 0.2s;
    outline: none;
    line-height: 1;
  }
  .sc-zoom-btn:hover { background: rgba(47,101,185,0.3); border-color: #2F65B9; }
  .sc-zoom-label {
    font-size: 12px;
    color: #A9A9BC;
    min-width: 38px;
    text-align: center;
    font-family: 'Inter', sans-serif;
  }

  @media (max-width: 600px) {
    .sc-pdf-topbar { padding: 12px 16px; }
    .sc-pdf-title { display: none; }
    .sc-arrow { width: 36px; height: 36px; }
    .sc-arrow-left  { left: 8px; }
    .sc-arrow-right { right: 8px; }
    .sc-zoom-controls { display: none; }
  }
</style>


<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function() {
  // UPDATED: Pointing to the new revised PDF
  var PDF_URL = 'https://diecastsupercon.com/wp-content/uploads/2026/05/Sponsor-Deck-revised-version.pdf';

  var pdfjsLib = window['pdfjs-dist/build/pdf'];
  if (!pdfjsLib) { showError(); return; }

  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  
  // ... rest of your existing script remains exactly the same ...
  var pdfDoc = null;
  var currentPage = 1;
  var zoomScale = 1.5;
  var rendering = false;
  var thumbCanvases = [];

  var canvas     = document.getElementById('scPdfCanvas');
  var ctx        = canvas.getContext('2d');
  var loader     = document.getElementById('scLoader');
  var errorBox   = document.getElementById('scError');
  var canvasWrap = document.getElementById('scCanvasWrap');
  var pageNum    = document.getElementById('scPageNum');
  var pageTotal  = document.getElementById('scPageTotal');
  var thumbsEl   = document.getElementById('scThumbs');
  var prevBtn    = document.getElementById('scPrev');
  var nextBtn    = document.getElementById('scNext');
  var zoomInBtn  = document.getElementById('scZoomIn');
  var zoomOutBtn = document.getElementById('scZoomOut');
  var zoomLabel  = document.getElementById('scZoomLabel');

  function showError() {
    loader.classList.add('hidden');
    errorBox.classList.add('visible');
  }

  function getScale(page) {
    if (window.innerWidth <= 600) {
      var stageW = (canvasWrap.clientWidth || window.innerWidth) - 24;
      var baseVp = page.getViewport({ scale: 1 });
      return stageW / baseVp.width;
    }
    return zoomScale;
  }

  function renderPage(num) {
    if (rendering) return;
    rendering = true;
    canvas.style.opacity = '0.4';

    pdfDoc.getPage(num).then(function(page) {
      var viewport = page.getViewport({ scale: getScale(page) });
      canvas.width  = viewport.width;
      canvas.height = viewport.height;

      page.render({ canvasContext: ctx, viewport: viewport }).promise.then(function() {
        canvas.style.opacity = '1';
        rendering = false;
        pageNum.textContent = num;
        prevBtn.disabled = num <= 1;
        nextBtn.disabled = num >= pdfDoc.numPages;
        updateThumbs(num);
      });
    }).catch(function() { rendering = false; });
  }

  function buildThumbs() {
    thumbsEl.innerHTML = '';
    thumbCanvases = [];
    for (var i = 1; i <= pdfDoc.numPages; i++) {
      (function(pageIdx) {
        var wrap = document.createElement('div');
        wrap.className = 'sc-thumb' + (pageIdx === 1 ? ' active' : '');
        wrap.setAttribute('data-page', pageIdx);

        var tc = document.createElement('canvas');
        wrap.appendChild(tc);
        thumbsEl.appendChild(wrap);
        thumbCanvases.push(wrap);

        pdfDoc.getPage(pageIdx).then(function(page) {
          var vp = page.getViewport({ scale: 0.18 });
          tc.width  = vp.width;
          tc.height = vp.height;
          page.render({ canvasContext: tc.getContext('2d'), viewport: vp });
        });

        wrap.addEventListener('click', function() {
          currentPage = pageIdx;
          renderPage(currentPage);
        });
      })(i);
    }
  }

  function updateThumbs(num) {
    thumbCanvases.forEach(function(w) {
      var isActive = parseInt(w.getAttribute('data-page')) === num;
      w.className = 'sc-thumb' + (isActive ? ' active' : '');
      if (isActive) {
        w.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      }
    });
  }

  pdfjsLib.getDocument({ url: PDF_URL, withCredentials: false }).promise.then(function(doc) {
    pdfDoc = doc;
    pageTotal.textContent = doc.numPages;
    loader.classList.add('hidden');
    canvasWrap.style.display = 'flex';
    nextBtn.disabled = false;
    buildThumbs();
    renderPage(1);
  }).catch(function(err) {
    console.warn('PDF load error:', err);
    showError();
  });

  prevBtn.addEventListener('click', function() { if (currentPage > 1) { currentPage--; renderPage(currentPage); } });
  nextBtn.addEventListener('click', function() { if (currentPage < (pdfDoc ? pdfDoc.numPages : 1)) { currentPage++; renderPage(currentPage); } });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { if (currentPage < pdfDoc.numPages) { currentPage++; renderPage(currentPage); } }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { if (currentPage > 1) { currentPage--; renderPage(currentPage); } }
  });

  var startX = 0;
  var stage = document.querySelector('.sc-pdf-stage');
  stage.addEventListener('touchstart', function(e) { startX = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener('touchend', function(e) {
    var diff = startX - e.changedTouches[0].clientX;
    if (Math.abs(diff) > 50) {
      if (diff > 0 && currentPage < pdfDoc.numPages) { currentPage++; renderPage(currentPage); }
      if (diff < 0 && currentPage > 1) { currentPage--; renderPage(currentPage); }
    }
  }, { passive: true });

  var resizeTimer;
  window.addEventListener('resize', function() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function() { if (pdfDoc) renderPage(currentPage); }, 200);
  });

  zoomInBtn.addEventListener('click', function() {
    if (zoomScale >= 3) return;
    zoomScale = Math.round((zoomScale + 0.25) * 100) / 100;
    zoomLabel.textContent = Math.round(zoomScale / 1.5 * 100) + '%';
    renderPage(currentPage);
  });
  zoomOutBtn.addEventListener('click', function() {
    if (zoomScale <= 0.75) return;
    zoomScale = Math.round((zoomScale - 0.25) * 100) / 100;
    zoomLabel.textContent = Math.round(zoomScale / 1.5 * 100) + '%';
    renderPage(currentPage);
  });

})();
</script>
